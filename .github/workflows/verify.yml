name: Verify

# Quality gate on every push / PR: i18n coverage, internal links, complete
# screenshot locale sets, title/description/FAQ sync, and that the generated
# shell is in sync with partials/. Read-only (no writes).
# Keep these steps in step with the `check` script in package.json — the two
# drifted before (check-meta-sync.js was in npm run check but not here, so it
# only ever ran locally while CLAUDE.md claimed CI enforced it).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: i18n coverage (every data-i18n key has ES + CA)
        run: node tools/check-i18n.js

      - name: Internal links, assets and anchors resolve
        run: node tools/check-links.js

      - name: Screenshot locale sets are complete
        run: node tools/check-screenshots.js

      - name: tools/i18n-meta.js matches the live title/description/FAQ copy
        run: node tools/check-meta-sync.js

      - name: Shell is in sync with partials/
        run: |
          node build.js
          if [ -n "$(git status --porcelain -- '*.html')" ]; then
            echo "::error::Generated shell is stale — run 'npm run build' and commit."
            git --no-pager diff -- '*.html'
            exit 1
          fi
          echo "Shell is in sync."
